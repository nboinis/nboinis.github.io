# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'        
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Make PNG link-preview images from SVG teasers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-liberation
          for f in images/publications/*.svg images/talks/*.svg images/projects/*.svg; do
            out="images/og/${f#images/}"; out="${out%.svg}.png"
            mkdir -p "$(dirname "$out")"
            rsvg-convert -w 1200 -h 600 -b white "$f" -o "$out"
          done
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Tell Bing (and other IndexNow search engines) that the site's pages changed
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          KEY: aac45e912c78be988d4c5c86027656a8
        run: |
          sleep 60
          curl -s https://nboinis.github.io/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' > urls.txt
          jq -R . urls.txt | jq -s --arg key "$KEY" '{host: "nboinis.github.io", key: $key, keyLocation: ("https://nboinis.github.io/" + $key + ".txt"), urlList: .}' > body.json
          curl -s -o /dev/null -w "IndexNow response: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @body.json
